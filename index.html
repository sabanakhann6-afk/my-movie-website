<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/MOVIEHUB title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101010;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#e50914;
 padding:20px;
 text-align:center;
 font-size:25px;
 font-weight:bold;
}
.search{
 padding:15px;
 text-align:center;
}
input{
 padding:13px;
 width:90%;
 max-width:400px;
 border-radius:8px;
 border:none;
}
h2{padding:0 15px}
.movies{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:15px;
 padding:15px;
}
.movie{
 background:#252525;
 border-radius:10px;
 overflow:hidden;
 text-align:center;
 padding-bottom:15px;
}
.poster{
 height:180px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#541313,#111);
 font-size:45px;
}
.movie h3{font-size:16px}
button{
 background:#e50914;
 color:white;
 border:0;
 padding:10px 18px;
 border-radius:6px;
}
footer{
 text-align:center;
 padding:25px;
 color:#aaa;
}
</style>
</head>
<body>

<header>🎬MOVIEHUB </header>

<div class="search">
<input id="search" placeholder="Search Movies..." oninput="findMovies()">
</div>

<h2>Latest Movies</h2>

<div class="movies" id="movies">

<div class="movie">
<div class="poster">🎥</div>
<h3>My First Movie</h3>
<button onclick="alert('Movie coming soon!')">Watch Now</button>
</div>

<div class="movie">
<div class="poster">🍿</div>
<h3>My Second Movie</h3>
<button onclick="alert('Movie coming soon!')">Watch Now</button>
</div>

<div class="movie">
<div class="poster">🎞️</div>
<h3>My Third Movie</h3>
<button onclick="alert('Movie coming soon!')">Watch Now</button>
</div>

<div class="movie">
<div class="poster">⭐</div>
<h3>My Fourth Movie</h3>
<button onclick="alert('Movie coming soon!')">Watch Now</button>
</div>

</div>

<footer>
<p>Welcome to My Movie World</p>
<p>© 2026 My Movie Website</p>
</footer>

<script>
function findMovies(){
 let q=document.getElementById('search').value.toLowerCase();
 document.querySelectorAll('.movie').forEach(m=>{
 m.style.display=m.innerText.toLowerCase().includes(q)?'block':'none';
 });
}
</script>

</body>
</html>
